# Đẩy phiên bản mới lên VPS mỗi khi có mã vào nhánh main.
#
# Bản web được build Ở ĐÂY chứ không trên máy chủ: Metro cần 1–1,5 GB
# RAM lúc đóng gói, VPS 1 nhân 3,8 GB đang chạy sẵn hai container rất
# dễ bị nhân hệ điều hành giết giữa chừng. Máy chạy CI thì thừa sức, và
# dùng xong là bỏ.
#
# Máy chủ vì vậy chỉ cần Python và Caddy — không Node, không node_modules
# 354 MB, ít thứ hỏng hơn hẳn.

name: Deploy

on:
  push:
    branches: [main]
  # Cho phép bấm chạy tay, dùng khi cần đẩy lại mà không sửa mã.
  workflow_dispatch:

concurrency:
  # Đẩy hai lần liên tiếp thì bỏ lượt cũ, chỉ chạy lượt mới nhất —
  # tránh hai lần deploy giẫm lên nhau giữa chừng.
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Dừng ngay nếu thiếu biến bí mật, thay vì chạy tiếp rồi chết ở
      # giữa với thông báo khó hiểu. Lần đầu dựng workflow này đã vấp
      # đúng chỗ đó: thiếu DEPLOY_TARGET nên ssh báo "Could not resolve
      # hostname :" — một dòng chẳng nói lên điều gì.
      - name: Kiểm biến bí mật
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          missing=""
          for v in DEPLOY_SSH_KEY_B64 DEPLOY_KNOWN_HOSTS DEPLOY_TARGET \
                   DEPLOY_DIR DEPLOY_HEALTH_URL; do
            eval "val=\$$v"
            [ -z "$val" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Thiếu biến bí mật:$missing"
            echo "Khai ở Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          # Cắt sạch khoảng trắng rồi dùng bản đã cắt ở các bước sau.
          #
          # Dán giá trị vào ô của GitHub rất dễ kèm theo một ký tự xuống
          # dòng ở cuối mà mắt không thấy. Với đường dẫn thì hậu quả rất
          # khó đoán: rsync gửi sang máy chủ một lệnh bị tách làm hai
          # dòng, và bash báo "line 2: /web/: No such file or directory"
          # — chẳng gợi ý gì về việc biến có xuống dòng thừa.
          {
            printf 'TARGET=%s\n' "$(printf '%s' "$DEPLOY_TARGET" | tr -d '[:space:]')"
            printf 'DIR=%s\n'    "$(printf '%s' "$DEPLOY_DIR" | tr -d '[:space:]')"
            printf 'HEALTH=%s\n' "$(printf '%s' "$DEPLOY_HEALTH_URL" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"
          echo "đủ 5 biến"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài phụ thuộc
        working-directory: frontend
        run: npm ci

      - name: Build bản web
        working-directory: frontend
        # same-origin: bundle KHÔNG nhúng địa chỉ máy chủ nào. Caddy phục
        # vụ web và chuyển tiếp /api trên cùng tên miền, nên đổi tên miền
        # về sau không phải build lại.
        env:
          EXPO_PUBLIC_API_BASE: same-origin
        run: npx expo export --platform web --output-dir ../web --clear

      - name: Chuẩn bị SSH
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Khoá được lưu dưới dạng base64 MỘT DÒNG chứ không phải
          # nguyên văn nhiều dòng. Lý do: dán khoá nhiều dòng vào ô của
          # GitHub rất dễ mất xuống dòng, và khi đó ssh chỉ báo "error
          # in libcrypto" — không hề nói rằng khoá bị méo. Một dòng thì
          # không còn gì để mất.
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Kiểm khoá đọc được trước khi dùng, để lỗi hiện ra ở đúng
          # chỗ sai thay vì thành "Permission denied" ở bước sau.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "Khoá riêng không đọc được. Kiểm lại secret DEPLOY_SSH_KEY_B64:"
            echo "nó phải là kết quả của: base64 < duong-dan-khoa | tr -d '\\n'"
            exit 1
          fi

          # Ghim khoá máy chủ thay vì chấp nhận bừa: không có dòng này
          # thì một kẻ chen giữa có thể nhận là máy chủ và lấy trọn mã
          # nguồn cùng quyền đăng nhập.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Kiểm thư mục đích trước khi đồng bộ
        # rsync --delete xoá mọi thứ không có trong nguồn. Trỏ nhầm chỗ
        # một lần là mất dữ liệu thật — đã xảy ra: một ký tự xuống dòng
        # thừa trong DEPLOY_DIR khiến rsync ghi vào gốc dự án và xoá
        # sạch .env cùng thư mục data/ chứa hệ số mô hình đã học.
        #
        # Nên trước khi xoá bất cứ thứ gì, bắt buộc xác nhận đang đứng
        # đúng chỗ: thư mục phải tồn tại và phải có docker-compose.yml.
        run: |
          case "$DIR" in
            /|/root|/home|/etc|/var|/usr|"")
              echo "DEPLOY_DIR không an toàn: '$DIR'"; exit 1 ;;
          esac
          if ! ssh "$TARGET" "test -f '$DIR/docker-compose.yml'"; then
            echo "Không thấy $DIR/docker-compose.yml trên máy chủ."
            echo "Dừng lại thay vì đồng bộ kèm --delete vào một thư mục lạ."
            exit 1
          fi
          echo "đích hợp lệ: $DIR"

      - name: Đồng bộ lên máy chủ
        # Dùng -rlptz chứ KHÔNG dùng -a: -a kéo theo -o -g, tức áp quyền
        # sở hữu của máy chạy CI lên file trên máy chủ, biến chúng thành
        # của một người dùng không tồn tại ở đó.
        run: |
          RS="rsync -rlptz --no-owner --no-group"
          $RS --delete web/ "$TARGET:$DIR/web/"
          $RS --delete \
            --exclude '.venv' --exclude '__pycache__' \
            --exclude 'data' --exclude '.env' \
            backend/ "$TARGET:$DIR/backend/"
          $RS deploy/ "$TARGET:$DIR/deploy/"
          $RS docker-compose.yml "$TARGET:$DIR/"

      - name: Dựng lại container
        # --force-recreate là bắt buộc, không phải cho chắc: bind mount
        # được giải quyết lúc container khởi động. Nếu thư mục trên máy
        # chủ bị thay mới, container cũ vẫn trỏ vào thư mục cũ đã biến
        # mất — API vẫn chạy nhưng trang web trả 404 và không có lỗi nào
        # trong log để lần ra.
        run: ssh "$TARGET" "cd $DIR && docker compose up -d --build --force-recreate"

      - name: Kiểm tra máy chủ đã sống lại
        # Không có bước này thì deploy hỏng vẫn báo xanh, và chỉ người
        # dùng mới phát hiện ra.
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$HEALTH" || true)
            if [ "$code" = "200" ]; then
              echo "máy chủ trả 200 sau $i lần thử"
              exit 0
            fi
            sleep 5
          done
          echo "máy chủ không trả 200 sau 150 giây — deploy coi như hỏng"
          exit 1
